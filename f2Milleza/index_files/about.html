    <div class="description">
        <h2>About RegIt - Registration App</h2>
        <textarea readonly>
        RegIt is a user-friendly registration application designed to simplify the process of event registration. 
        It helps users fill out their personal details, including name, email, gender, and date of birth, while 
        also offering a streamlined interface for quick access and form submission.

        Features of RegIt:
        - Easy-to-use interface with minimal form fields
        - Secure data handling and storage
        - Simple navigation with a clear structure
        - Option to view and manage your event registrations
        - Clean design focused on user experience
        
        Whether you’re registering for conferences, seminars, workshops, or any other event, RegIt makes 
        the process faster and hassle-free. The platform is designed to cater to individuals as well as 
        event organizers looking for an efficient way to manage registrations.

        With RegIt, all your registration needs are just a few clicks away. Say goodbye to long forms and 
        complicated systems.
        </textarea>
