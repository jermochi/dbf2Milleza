<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RegIt</title>
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0px;
        }

        header {
            background-color: rgba(136, 201, 107, 0.5);
            width: 100%;
            padding-left: 150px;
            color: white;
            display: flex;
            align-items: center;
        }

        header nav {
            display: flex;
            margin-left: auto;
            padding-right: 150px;
            gap: 100px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .contact-list {
            width: 800px;
            margin: 100px auto;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
            background-color: white;
            font-size: 18px;
            font-weight: normal;
        }

        .contact {
            margin-bottom: 20px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .contact h3 {
            font-size: 20px;
            color: #333;
        }

        .contact p {
            font-size: 16px;
            color: #555;
        }

        footer {
            background-color: rgba(136, 201, 107, 0.1);
            width: 100%;
            margin-top: auto;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>RegIt</h1>
        <img src="logo.png" alt="Logo" style="height: 50px; margin-left: 25px;">
        <nav>
            <a href="index.html">Login</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <div class="contact-list">
        <h2>Contact List</h2>

        <div class="contact">
            <h3>John Doe</h3>
            <p>Email: john.doe@example.com</p>
            <p>Phone: (123) 456-7890</p>
        </div>

        <div class="contact">
            <h3>Jane Smith</h3>
            <p>Email: jane.smith@example.com</p>
            <p>Phone: (234) 567-8901</p>
        </div>

        <div class="contact">
            <h3>Samuel Adams</h3>
            <p>Email: samuel.adams@example.com</p>
            <p>Phone: (345) 678-9012</p>
        </div>

    </div>

    <footer>
        <p>Jervin Ryle I. Milleza | BSCS - 2</p>
    </footer>

</body>

</html>
